name: FORTEX - catálogo maestro (aislado)
on:
  push:
    branches:
      - feature/catalogo-maestro-vehiculos-v1
      - integration/catalogo-maestro-recibo-plateado-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogo-django-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: fortex_ci
          POSTGRES_PASSWORD: solo_pruebas_ci
          POSTGRES_DB: fortex_catalogo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fortex_ci -d fortex_catalogo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_SECRET_KEY: "ci-temporal-no-productivo-catalogo"
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DB_NAME: fortex_catalogo_ci
      DB_USER: fortex_ci
      DB_PASSWORD: solo_pruebas_ci
      DB_HOST: localhost
      DB_PORT: "5432"
      FORTEX_RECEIPT_SECURITY_ENABLED: "false"
    steps:
      - name: Checkout exclusivo de la rama experimental
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Django - integridad y migraciones
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Pruebas del catálogo en PostgreSQL 18
        run: |
          python manage.py test vehiculos.tests_catalogo --verbosity 2
          python manage.py fortex_catalogo_importar --archivo vehiculos/catalogo_maestro/ejemplo_dnrpa_sintetico.csv --codigo CI --titulo "Fichas sintéticas" --aplicar
          python manage.py fortex_catalogo_importar --archivo vehiculos/datos_dnrpa/catalogo_motos_dnrpa_2026.csv --codigo DNRPA_MOTOS_2026 --titulo "Catalogo curado de motovehiculos" --aplicar
          python manage.py fortex_catalogo_importar --archivo vehiculos/datos_dnrpa/catalogo_motos_dnrpa_2026.csv --codigo DNRPA_MOTOS_2026 --titulo "Catalogo curado de motovehiculos" --aplicar
          python manage.py fortex_catalogo_importar --archivo vehiculos/datos_dnrpa/dnrpa-inscripciones-iniciales-autos-202501.csv --codigo DNRPA_AUTOS_202501 --titulo "DNRPA automotores enero 2025" --licencia "CC BY 4.0" --aplicar
          python manage.py fortex_catalogo_auditar
      - name: Sintaxis de JS (sin navegador ni clientes)
        run: |
          node --check vehiculos/static/vehiculos/catalogo_maestro/catalogo_riesgo.js
