<!DOCTYPE html>
<html lang="es">
{% load static %}

<head>
    <meta charset="UTF-8">
    <title>Nuevo Riesgo - Fortex</title>
    <link rel="stylesheet" href="{% static 'principal/css/estilos.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="fortex-navbar">
    <div class="fortex-navbar-contenido">
        <span class="fortex-marca">
            🐺 FORTEX Gestión Integral
        </span>

        <a href="/" class="fortex-volver">
            ⬅ Volver al Escritorio
        </a>
    </div>
</nav>

<div class="container">
    <div class="card shadow">
        <div class="card-body">

            <h3>✏️ Editar Riesgo</h3>

            <form method="POST"
              id="form-riesgo"
              onsubmit="return confirmarGuardadoRiesgo(event)"
            >
                {% csrf_token %}

                {% if errores %}
                   <div class="alerta-errores">
                      <strong>⚠️ No se pudo guardar el riesgo</strong>

                   <ul>
                     {% for error in errores %}
                       <li>{{ error }}</li>
                     {% endfor %}
                   </ul>
                 </div>
                {% endif %}

                <label>Cliente</label>

                <input
                   class="form-control mb-3"
                   type="text"
                   value="{{ riesgo.cliente.apellido }}, {{ riesgo.cliente.nombre }} - DNI {{ riesgo.cliente.dni }}"
                   readonly>

                <label>Tipo de Riesgo</label>
                <select class="form-select mb-4" name="tipo_riesgo">
                    <option>Automotor</option>
                    <option>Motocicleta</option>
                    <option>Hogar</option>
                    <option>Accidentes Personales</option>
                    <option>Caución</option>
                    <option>Agro</option>
                    <option>Vida</option>
                    <option>Comercio</option>
                </select>

                <h5>🚗 Datos del vehículo</h5>

                <input
                  class="form-control mb-3"
                  type="text"
                  name="patente"
                  placeholder="Patente"
                  value="{{ riesgo.patente }}">
                  required
                >

                <input
                 class="form-control mb-3"

                 type="text"
                 name="marca"
                 placeholder="Marca"
                 value="{{ riesgo.marca|default:'' }}"
                 required
                >

                <input
                  class="form-control mb-3"
                  type="text"
                  name="modelo"
                  placeholder="Modelo"
                  value="{{ riesgo.modelo|default:'' }}"
                  required
                >

                <input
                  class="form-control mb-3"
                  type="number"
                  name="anio"
                  placeholder="Año"
                  min="1900"
                  max="2100"
                  value="{{ riesgo.anio|default:'' }}"
                  required
                >

                <input
                  class="form-control mb-3"
                  type="text"
                  name="motor"
                  placeholder="Número de motor"
                  value="{{ riesgo.motor|default:'' }}"
                  required
                >

                <input
                  class="form-control mb-3"
                  type="text"
                  name="chasis"
                  placeholder="Número de chasis"
                  value="{{ riesgo.chasis|default:'' }}"
                  required
>

                

                    <label>Uso del vehículo</label>
                    <select class="form-select mb-3" name="uso" required>
                
                     <option value="">Uso del vehículo</option>

                     <option value="Particular" {% if riesgo.uso == "Particular" %}selected{% endif %}>Particular
                     </option>

                     <option value="Comercial" {% if riesgo.uso == "Comercial" %}selected{% endif %}>Comercial
                     </option>

                     <option value="Taxi" {% if riesgo.uso == "Taxi" %}selected{% endif %}>Taxi
                     </option>

                     <option value="Furgón" {% if riesgo.uso == "Furgón" %}selected{% endif %}>Furgón
                     </option>

                     <option value="Camión" {% if riesgo.uso == "Camión" %}selected{% endif %}>Camión
                     </option>

                     <option value="Acoplado" {% if riesgo.uso == "Acoplado" %}selected{% endif %}>Acoplado
                     </option>

                </select>

        <div class="grupo-botones">

            <button class="btn btn-success" type="submit">
               💾 Guardar Cambios
            </button>

            <a href="/" class="btn btn-secondary">
                Cancelar
            </a>

          </div>

            </form>

      
            <script>
            function confirmarGuardadoRiesgo(event) {
              const formulario = event.target;

              if (!formulario.checkValidity()) {
                  formulario.reportValidity();
                  return false;
              }

                  return confirm("¿Confirma que desea registrar este riesgo en FORTEX?");
}
</script>

</body>
</html>
