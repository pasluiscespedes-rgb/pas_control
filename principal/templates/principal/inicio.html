<script>
window.addEventListener("load", function () {
    window.scrollTo(0, 1);
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const dashboard = document.querySelector(".fortex-dashboard");
    const lobo = document.querySelector(".nucleo-lobo-fortex");
    const circuito = document.querySelector("#circuito-fortex-path");

    const modulos = document.querySelectorAll(
        ".fortex-modulo-svg, .fortex-acceso-rapido"
    );

    if (!dashboard || !lobo || !circuito) return;


    function crearCircuito(origen) {

        const area = dashboard.getBoundingClientRect();
        const inicio = origen.getBoundingClientRect();
        const destino = lobo.getBoundingClientRect();

        const x1 =
            inicio.left +
            inicio.width / 2 -
            area.left;

        const y1 =
            inicio.top +
            inicio.height / 2 -
            area.top;

        const x2 =
            destino.left +
            destino.width / 2 -
            area.left;

        const y2 =
            destino.top +
            destino.height / 2 -
            area.top;


        /*
         Circuito angular:
         horizontal → diagonal corta →
         horizontal → llegada al núcleo
        */

        const direccion = x2 > x1 ? 1 : -1;

        const tramo1 = x1 + (55 * direccion);
        const tramo2 = tramo1 + (35 * direccion);

        const mitadY = y1 + ((y2 - y1) * 0.5);


        const ruta = `
            M ${x1} ${y1}
            L ${tramo1} ${y1}
            L ${tramo2} ${mitadY}
            L ${x2 - (45 * direccion)} ${mitadY}
            L ${x2} ${y2}
        `;

        circuito.setAttribute("d", ruta);

        circuito.classList.add("activo");
        lobo.classList.add("energia-activa");
    }


    function apagarCircuito() {
        circuito.classList.remove("activo");
        lobo.classList.remove("energia-activa");
    }


    modulos.forEach(modulo => {

        modulo.addEventListener("mouseenter", function () {
            crearCircuito(modulo);
        });

        modulo.addEventListener("mouseleave", apagarCircuito);

    });

});

</script>
