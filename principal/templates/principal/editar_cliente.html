<!DOCTYPE html>
<html lang="es">
{% load static %}

<head>
    <meta charset="UTF-8">
    <title>Editar Cliente - Fortex</title>
    <link rel="stylesheet" href="{% static 'principal/css/estilos.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="fortex-navbar">
    <div class="fortex-navbar-contenido">
        <span class="fortex-marca">
            🐺 FORTEX Gestión Integral
        </span>

        <a href="/" class="fortex-volver">
            ⬅ Volver al Escritorio
        </a>
    </div>
</nav>

<div class="container">
    <div class="card shadow">
        <div class="card-body">

            <h3>✏️ Editar Cliente</h3>

            <form
              method="POST"
              id="form-editar-cliente"
              onsubmit="return confirmarGuardadoCliente(event)"
>
                {% csrf_token %}

                {% if errores %}
                   <div class="alerta-errores">
                     <strong>⚠️ No se pudo guardar el cliente</strong>

                     <ul>
                       {% for error in errores %}
                         <li>{{ error }}</li>
                       {% endfor %}
                      </ul>
                    </div>
                {% endif %}

                <input
                  class="form-control mb-3"
                  type="text"
                  name="apellido"
                  placeholder="Apellido"
                  value="{{ datos.apellido|default:cliente.apellido }}"
                  required
                >

                <input
                  class="form-control mb-3"
                  type="text"
                  name="nombre"
                  placeholder="Nombre"
                  value="{{ datos.nombre|default:cliente.nombre }}"
                  required
                >

                <input
                  class="form-control mb-3"
                  type="text"
                  name="dni"
                  placeholder="DNI"
                  value="{{ datos.dni|default:cliente.dni }}"
                  required
                >

                <input
                  class="form-control mb-3"
                  type="text"
                  name="whatsapp"
                  placeholder="WhatsApp"
                  value="{{ datos.whatsapp|default:cliente.whatsapp }}"
                  required
                >

                <label>Fecha de nacimiento</label>

                <input
                  class="form-control mb-3"
                  type="date"
                  name="fecha_nacimiento"
                  placeholder="Fecha nacimiento"
                  value="{% if datos.fecha_nacimiento %}{{ datos.fecha_nacimiento }}{% else %}{{ cliente.fecha_nacimiento|date:'Y-m-d' }}{% endif %}"
                  required
                >

                <hr>

<h5>📍 Domicilio</h5>

<input class="form-control mb-3" type="text" name="calle" placeholder="Calle" value="{{ datos.calle|default:cliente.calle }}">

<div class="row">
    <div class="col-md-3">
        <input class="form-control mb-3" type="text" name="numero" placeholder="Número" value="{{ datos.numero|default:cliente.numero }}">
    </div>

    <div class="col-md-3">
        <input class="form-control mb-3" type="text" name="piso" placeholder="Piso" value="{{ datos.piso|default:cliente.piso }}">
    </div>

    <div class="col-md-3">
        <input class="form-control mb-3" type="text" name="departamento" placeholder="Departamento" value="{{ datos.departamento|default:cliente.departamento }}">
    </div>

    <div class="col-md-3">
        <input class="form-control mb-3" type="text" name="codigo_postal" placeholder="Código Postal" value="{{ datos.codigo_postal|default:cliente.codigo_postal }}">
    </div>
</div>

<input class="form-control mb-3" type="text" name="barrio" placeholder="Barrio" value="{{ datos.barrio|default:cliente.barrio }}">
<input class="form-control mb-3" type="text" name="localidad" placeholder="Localidad" value="{{ datos.localidad|default:cliente.localidad }}">

<select class="form-select mb-3" name="provincia">
    <option value="">Seleccione una provincia</option>
    <option>Buenos Aires</option>
    <option>CABA</option>
    <option>Catamarca</option>
    <option>Chaco</option>
    <option>Chubut</option>
    <option>Córdoba</option>
    <option>Corrientes</option>
    <option>Entre Ríos</option>
    <option>Formosa</option>
    <option>Jujuy</option>
    <option>La Pampa</option>
    <option>La Rioja</option>
    <option>Mendoza</option>
    <option>Misiones</option>
    <option>Neuquén</option>
    <option>Río Negro</option>
    <option>Salta</option>
    <option>San Juan</option>
    <option>San Luis</option>
    <option>Santa Cruz</option>
    <option>Santa Fe</option>
    <option>Santiago del Estero</option>
    <option>Tierra del Fuego</option>
    <option>Tucumán</option>
</select>

<hr>

<h5>📞 Contacto</h5>

<input class="form-control mb-3" type="email" name="email" placeholder="Correo electrónico" value="{{ datos.email|default:cliente.email }}">

<input class="form-control mb-3" type="text" name="telefono_alternativo" placeholder="Teléfono alternativo" value="{{ datos.telefono_alternativo|default:cliente.telefono_alternativo }}">

<textarea class="form-control mb-3" name="observaciones" rows="4" placeholder="Observaciones">{% if datos.observaciones %}{{ datos.observaciones }}{% else %}{{ cliente.observaciones }}{% endif %}</textarea>
                

                <div class="grupo-botones">

                    <button class="btn btn-success" type="submit">
                       💾 Guardar Cambios
                    </button>

                    <a href="/" class="btn btn-secondary">
                       Cancelar
                    </a>

                </div>
                
            </form>
            <script>
             function confirmarEdicionCliente(event) {
                   const formulario = event.target;

                   if (!formulario.checkValidity()) {
                        formulario.reportValidity();
                        return false;
                    }

                    return confirm(
                         "¿Confirma que desea actualizar los datos de este cliente?"
                    );
            }
            </script>

        </div>
    </div>
</div>

</body>
</html>
