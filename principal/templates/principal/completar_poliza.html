<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Completar Póliza</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-primary text-white">
<h3>📄 Completar Póliza Definitiva</h3>
</div>

<div class="card-body">

<h5>{{ cliente.apellido }}, {{ cliente.nombre }}</h5>

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Número de póliza</label>

<input
type="text"
name="numero_poliza"
class="form-control"
required>

</div>

<button class="btn btn-success">
💾 Guardar Número
</button>

<a href="{% url 'ver_poliza' poliza.id %}"
class="btn btn-secondary">
Cancelar
</a>

</form>

</div>

</div>

</div>

</body>
</html>
