<!DOCTYPE html>
<html lang="es">
{% load static %}
<head>
    <meta charset="UTF-8">
    <title>Registrar Cobro</title>

    <link rel="stylesheet" href="{% static 'principal/css/estilos.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="fortex-navbar">
    <div class="fortex-navbar-contenido">
        <span class="fortex-marca">
            🐺 FORTEX Gestión Integral
        </span>

        <a href="/" class="fortex-volver">
            ⬅ Volver al Escritorio
        </a>
    </div>
</nav>

<div class="container">

<div class="card shadow">

<div class="card-body">

<h3>💰 Registrar Cobro</h3>

{% if error %}
    <div class="alert alert-danger">
        ⚠️ {{ error }}
    </div>
{% endif %}

<form method="POST">

{% csrf_token %}

<label>Póliza</label>

<select
    class="form-select mb-3"
    name="poliza"
    id="poliza"
    required
    onchange="actualzarPoliza(this)"

> 
 
{% for poliza in polizas %}
    <option
    value="{{ poliza.id }}"
    {% if poliza_seleccionada and poliza.id == poliza_seleccionada.id %}selected{% endif %}
    data-cuota="{{ poliza.numero_cuota }}"
    data-total="{{ poliza.cantidad_cuotas }}"
    data-vencimiento="{{ poliza.fecha_vencimiento|date:'d/m/Y' }}"
>
        {% if poliza.vehiculo %}
            {{ poliza.vehiculo.patente }} -
            {{ poliza.vehiculo.marca }}
            {{ poliza.vehiculo.modelo }} -
        {% else %}
            SIN VEHÍCULO -
        {% endif %}

        {{ poliza.compania }} -

        {% if poliza.numero_poliza %}
            Póliza {{ poliza.numero_poliza }}
        {% else %}
            Póliza provisoria
        {% endif %}
    </option>
{% endfor %}

</select>

<div id="info-poliza" class="alert alert-info mt-3">
    <strong>Vehículo:</strong> Seleccione una póliza.
</div>

<label>Fecha de pago</label>

<input class="form-control mb-3"
type="date"
name="fecha_pago">

<label>Importe</label>

<input class="form-control mb-3"
       type="text"
       name="importe"
       id="importe"
       inputmode="decimal"
       placeholder="Ej: 40.000,00">

<label>Plus interno</label>

<input
    class="form-control mb-3"
    type="text"
    name="plus"
    id="plus"
    inputmode="decimal"
    placeholder="Ej: 5.000,00"
    value="0"
>       

<label>Cuota actual</label>

<input
    class="form-control mb-3"
    type="number"
    name="cuota"
    id="cuota"
    value=""
    readonly
>

<label>Cantidad de cuotas pagadas</label>

<input
    class="form-control mb-3"
    type="number"
    name="cantidad_cuotas_pagadas"
    value="1"
    min="1">

<label>Forma de pago</label>

<select class="form-select mb-3" name="forma_pago">

<option>Efectivo</option>
<option>Transferencia</option>
<option>Débito</option>
<option>Tarjeta</option>

</select>

<textarea
class="form-control mb-3"
rows="3"
name="observaciones"
placeholder="Observaciones">
</textarea>

<div class="grupo-botones">

    <button class="btn btn-success" type="submit">
        💾 Guardar Cliente
    </button>

    <a href="/" class="btn btn-secondary">
        Cancelar
    </a>

</div>

</form>

</div>

</div>

</div>

<script>
function actualizarPoliza(selector) {
    const opcion = selector.options[selector.selectedIndex];
    const infoPoliza = document.getElementById("info-poliza");
    const campoCuota = document.getElementById("cuota");

    if (!opcion || !opcion.value) {
        campoCuota.value = "";
        infoPoliza.innerHTML =
            "<strong>Vehículo:</strong> Seleccione una póliza.";
        return;
    }

    const cuota = opcion.dataset.cuota || "";
    const total = opcion.dataset.total || "";
    const vencimiento = opcion.dataset.vencimiento || "Sin fecha";

    campoCuota.value = cuota;

    infoPoliza.innerHTML =
        "<strong>Vehículo seleccionado:</strong><br>" +
        opcion.text.trim() +
        "<br><strong>Cuota actual:</strong> " +
        cuota + " de " + total +
        "<br><strong>Próximo vencimiento:</strong> " +
        vencimiento;
}

document.addEventListener("DOMContentLoaded", function () {
    const selector = document.getElementById("poliza");

    if (selector) {
        actualizarPoliza(selector);
    }
});
</script>



</body>
</html>
