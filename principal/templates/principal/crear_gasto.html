{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Gasto</title>

    <link rel="stylesheet" href="{% static 'principal/css/estilos.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

<div class="card shadow">

<div class="card-body">

<h3>💸 Registrar gasto</h3>

<form method="POST">

{% csrf_token %}

<label>Concepto</label>
<input type="text" name="concepto" class="form-control mb-3">

<label>Importe</label>
<input type="number" step="0.01" name="importe" class="form-control mb-3">

<label>Observaciones</label>
<textarea name="observaciones" class="form-control mb-3"></textarea>

<button class="btn btn-danger">
Guardar gasto
</button>

<a href="/caja/" class="btn btn-secondary">
Volver
</a>

</form>

</div>

</div>

</div>

</body>
</html>
