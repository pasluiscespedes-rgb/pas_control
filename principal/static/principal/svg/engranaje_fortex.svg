<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 400 400"
    width="400"
    height="400"
>

    <defs>
        <!-- Metal exterior -->
        <linearGradient id="metalExterior" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#171c23"/>
            <stop offset="22%" stop-color="#7f8994"/>
            <stop offset="42%" stop-color="#d4d9de"/>
            <stop offset="58%" stop-color="#59626c"/>
            <stop offset="78%" stop-color="#20262d"/>
            <stop offset="100%" stop-color="#0c1117"/>
        </linearGradient>

        <!-- Metal interior -->
        <radialGradient id="metalInterior" cx="45%" cy="35%">
            <stop offset="0%" stop-color="#263648"/>
            <stop offset="45%" stop-color="#101923"/>
            <stop offset="100%" stop-color="#03070b"/>
        </radialGradient>

        <!-- Azul eléctrico -->
        <linearGradient id="azulFortex" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#78dcff"/>
            <stop offset="45%" stop-color="#00aaff"/>
            <stop offset="100%" stop-color="#0066ff"/>
        </linearGradient>

        <!-- Glow azul -->
        <filter id="glowAzul" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Sombra -->
        <filter id="sombraMetal" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow
                dx="0"
                dy="6"
                stdDeviation="6"
                flood-color="#000000"
                flood-opacity="0.75"
            />
        </filter>
    </defs>

    <!-- ===================================== -->
    <!-- CUERPO EXTERIOR + 12 DIENTES          -->
    <!-- ===================================== -->

    <g filter="url(#sombraMetal)">

        <!-- cuerpo circular -->
        <circle
            cx="200"
            cy="200"
            r="145"
            fill="url(#metalExterior)"
            stroke="#0b0f14"
            stroke-width="8"
        />

        <!-- 12 dientes -->
        <g fill="url(#metalExterior)" stroke="#0b0f14" stroke-width="5">

            <rect x="180" y="15" width="40" height="60" rx="7" transform="rotate(0 200 200)"/>
            <rect x="180" y="15" width="40" height="60" rx="7" transform="rotate(30 200 200)"/>
            <rect x="180" y="15" width="40" height="60" rx="7" transform="rotate(60 200 200)"/>
            <rect x="180" y="15" width="40" height="60" rx="7" transform="rotate(90 200 200)"/>
            <rect x="180" y="15" width="40" height="60" rx="7" transform="rotate(120 200 200)"/>
            <rect x="180" y="15" width="40" height="60" rx="7" transform="rotate(150 200 200)"/>
            <rect x="180" y="15" width="40" height="60" rx="7" transform="rotate(180 200 200)"/>
            <rect x="180" y="15" width="40" height="60" rx="7" transform="rotate(210 200 200)"/>
            <rect x="180" y="15" width="40" height="60" rx="7" transform="rotate(240 200 200)"/>
            <rect x="180" y="15" width="40" height="60" rx="7" transform="rotate(270 200 200)"/>
            <rect x="180" y="15" width="40" height="60" rx="7" transform="rotate(300 200 200)"/>
            <rect x="180" y="15" width="40" height="60" rx="7" transform="rotate(330 200 200)"/>

        </g>
    </g>

    <!-- ===================================== -->
    <!-- REBAJE OSCURO                         -->
    <!-- ===================================== -->

    <circle
    cx="200"
    cy="200"
    r="126"
    fill="#05090e"
    stroke="#2b343e"
    stroke-width="12"
/>

<circle
    cx="200"
    cy="200"
    r="118"
    fill="#070d14"
    stroke="#0b1118"
    stroke-width="6"
/>

    <!-- ===================================== -->
    <!-- ARO AZUL RETROCEDIDO                  -->
    <!-- ===================================== -->

    <circle
        cx="200"
        cy="200"
        r="108"
        fill="none"
        stroke="url(#azulFortex)"
        stroke-width="7"
        filter="url(#glowAzul)"
    />

    <!-- ===================================== -->
    <!-- NÚCLEO INTERIOR                       -->
    <!-- ===================================== -->

    <circle
        cx="200"
        cy="200"
        r="98"
        fill="url(#metalInterior)"
        stroke="#1c2936"
        stroke-width="4"
    />

<!-- REMACHES METÁLICOS FORTEX -->
<g id="remaches-fortex">

    <defs>
        <radialGradient id="metalRemache" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="28%" stop-color="#b9d8f5"/>
            <stop offset="60%" stop-color="#526a82"/>
            <stop offset="100%" stop-color="#111923"/>
        </radialGradient>

        <filter id="brilloRemache">
            <feDropShadow dx="0" dy="1"
                          stdDeviation="1.5"
                          flood-color="#00aeff"
                          flood-opacity="0.55"/>
        </filter>
    </defs>

    <g fill="url(#metalRemache)"
       stroke="#07111c"
       stroke-width="2"
       filter="url(#brilloRemache)">

        <circle cx="200" cy="82"  r="5"/>
        <circle cx="283" cy="117" r="5"/>
        <circle cx="318" cy="200" r="5"/>
        <circle cx="283" cy="283" r="5"/>
        <circle cx="200" cy="318" r="5"/>
        <circle cx="117" cy="283" r="5"/>
        <circle cx="82"  cy="200" r="5"/>
        <circle cx="117" cy="117" r="5"/>

    </g>
</g>

</svg>